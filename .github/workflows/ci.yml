name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Run tests
        run: ./scripts/test.sh
